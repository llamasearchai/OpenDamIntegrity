name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: |
          python -m pip install -U pip
          pip install -e .[dev]

      - name: Format (auto-fix imports and code style)
        run: make format

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Smoke CLI
        run: PYTHONPATH=src python scripts/validate_smoke.py

      - name: Smoke API (in-process)
        run: PYTHONPATH=src python scripts/smoke_api.py --mode inproc
