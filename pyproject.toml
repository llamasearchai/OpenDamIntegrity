[project]
name = "opendamintegry"
version = "0.1.1"
description = "Advanced Python system for tailings dam integrity monitoring, analysis, and prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "Nik Jois", email = "nikjois@llamasearch.ai" } ]
keywords = ["geotechnical", "stability", "dam", "InSAR", "piezometer", "inclinometer", "FEA", "VTK"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# Core dependencies kept modest; heavy stacks offered via extras
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.6",
  "typer>=0.9",
  "rich>=13.0",
  "requests>=2.31",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
ml = [
  "xgboost>=1.7",
]
viz = [
  "vtk>=9.2",
  "mayavi>=4.7.4",
]
fea = [
  "pynastran>=1.4.0",
  "meshio>=5.3",
]
alerts = [
  "twilio>=8.5",
]
reports = [
  # Optional: HTML-to-PDF; core HTML reports use Jinja2 only
  "weasyprint>=61.0",
]
llm = [
  "openai>=1.40.0",
]
datasette = [
  "datasette>=0.64",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.8",
  "tox>=4.11",
  "tox-uv>=1.5",
  "build>=1.2",
  "hatch>=1.9",
  "hatchling>=1.25",
]

[project.scripts]
odintegry = "open_dam_integry.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/open_dam_integry/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/open_dam_integry"]
include = [
  "src/open_dam_integry/templates/**",
]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]
ignore = ["E501", "B008", "C901"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
