# OpenDamIntegry configuration

[project]
name = "OpenDamIntegry"

[thresholds]
# Example thresholds for risk levels (units: factor of safety / mm displacement / kPa pore pressure etc.)
normal_fs_min = 1.3
watch_fs_min = 1.2
warning_fs_min = 1.1
alert_fs_min = 1.0

[alerts]
email_enabled = false
sms_enabled = false

[weather]
provider = "open-meteo"
latitude = 0.0
longitude = 0.0

